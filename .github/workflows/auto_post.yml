name: Auto Generate, Publish & Bluesky Promote

on:
  schedule:
    # 1日に5回自動実行（JST: 08:30, 12:30, 16:30, 19:30, 22:30）
    # UTC: 23:30, 03:30, 07:30, 10:30, 13:30
    - cron: '30 23,3,7,10,13 * * *'
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  auto_generate_and_promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests atproto Pillow

      - name: Generate New Comparison Article (Rakuten & Gemini)
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_post.py

      - name: Post Article Summary & Promotion to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE || 'tigyu-cosme.bsky.social' }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD || 'ebeq-ainb-o63m-tfwc' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/bluesky_tigyu_poster.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Next.js Build
        run: |
          npm ci
          npm run build

      - name: Commit and Push New Article & Bluesky History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json posted_cache.txt bluesky_post_history.txt bluesky_text_history.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "feat(auto): new comparison article & bluesky promotion [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
