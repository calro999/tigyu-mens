name: Auto Generate & Publish Articles

on:
  schedule:
    # 1日に3回自動更新（JST: 08:00, 13:00, 20:00）
    # UTC: 23:00, 04:00, 11:00
    - cron: '0 23,4,11 * * *'
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  auto_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate New Comparison Article
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_post.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Next.js Build
        run: |
          npm ci
          npm run build

      - name: Commit and Push New Article & Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posts.json posted_cache.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "feat(auto): publish new comparison article via Rakuten & Gemini [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
